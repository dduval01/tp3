name: Check required files

on:
  pull_request:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md AI_Prompts.md requirements.txt .gitignore; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
